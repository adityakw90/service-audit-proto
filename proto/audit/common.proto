syntax = "proto3";

package audit.common;

option go_package = "github.com/adityakw90/service-audit-proto/gen/go/common;common";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Event mirrors the externally visible columns of the event table.
// The internal BIGINT primary key is intentionally not exposed.
message Event {
  string uid = 1;
  string source = 2;
  string event_id = 3;
  string action = 4;
  string actor_type = 5;
  string actor_id = 6;
  optional string actor_name = 7;
  string entity_type = 8;
  string entity_id = 9;
  optional string entity_name = 10;
  google.protobuf.Struct metadata = 11;
  google.protobuf.Timestamp occurred_at = 12;
  google.protobuf.Timestamp created_at = 13;
}

// message source
message Source {
  string name = 1;
}

// message Entity
message Entity {
  string type = 1;
  string id = 2;
  optional string name = 3;
}

// message Actor
message Actor {
  string type = 1;
  string id = 2;
  optional string name = 3;
}