name: Service Audit Proto CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install Poetry
        run: pipx install poetry

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "poetry"

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "28.1"

      - name: Install dependencies
        run: make deps

      - name: Generate Code
        run: |
          make all

      - name: Verify No Changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code is out of sync. Please run 'make all' and commit the changes."
            git status
            git diff
            exit 1
          fi
